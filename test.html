<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faculty Dashboard</title>
<link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
<style>
    body {
        background: #0a0e27;
        color: #e8eaed;
        font-family: Arial, sans-serif;
        margin: 0;
    }

    /* Top bar */
    .topbar {
        background: #10152a;
        border-bottom: 1px solid #232a45;
        padding: 14px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .topbar h4 { margin: 0; color: #f4f4f5; }
    .topbar-icons { display: flex; gap: 18px; font-size: 1.2rem; color: #8b92ab; }

    /* Layout */
    .layout { display: flex; min-height: calc(100vh - 60px); }

    /* Sidebar */
    .sidebar {
        width: 220px;
        background: #10152a;
        border-right: 1px solid #232a45;
        padding: 20px 0;
        flex-shrink: 0;
    }
    .sidebar a {
        display: block;
        padding: 12px 24px;
        color: #8b92ab;
        text-decoration: none;
        font-size: 0.95rem;
    }
    .sidebar a.active {
        color: #fff;
        background: rgba(124, 42, 232, 0.15);
        border-left: 3px solid #7c2ae8;
    }
    .sidebar a:hover { color: #fff; background: rgba(124, 42, 232, 0.08); }

    /* Main content */
    .main { flex: 1; padding: 30px; min-width: 0; }
    .greeting { color: #f4f4f5; margin-bottom: 24px; }

    .card {
        background: #131829;
        border: 1px solid #232a45;
        border-radius: 12px;
        color: #e8eaed;
    }

    .status-icon-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
        background: #16ff8b;
        box-shadow: 0 0 8px rgba(22, 255, 139, 0.6);
        margin-right: 6px;
    }

    .stat-number { font-size: 1.8rem; font-weight: 700; color: #f4f4f5; }
    .stat-label { color: #8b92ab; font-size: 0.85rem; }

    /* Form controls on dark theme */
    .form-select, .form-control {
        background: #0e1224;
        border: 1px solid #2a3150;
        color: #e8eaed;
    }
    .form-select:focus, .form-control:focus {
        background: #0e1224;
        color: #fff;
        border-color: #7c2ae8;
        box-shadow: 0 0 0 0.2rem rgba(124, 42, 232, 0.25);
    }
    .form-label { color: #8b92ab; font-size: 0.85rem; }

    .btn-primary {
        background: linear-gradient(90deg, #7c2ae8, #a742f0);
        border: none;
    }
    .btn-primary:hover {
        background: linear-gradient(90deg, #6a1fd0, #9333e0);
    }

    /* ===== TIME-GRID CALENDAR ===== */
    .schedule-scroll {
        overflow-x: auto;
    }
    .time-grid {
        display: grid;
        grid-template-columns: 70px repeat(7, minmax(110px, 1fr));
        min-width: 850px;
        border: 1px solid #232a45;
        border-radius: 10px;
        overflow: hidden;
    }

    .grid-header {
        background: #0e1224;
        padding: 10px 6px;
        text-align: center;
        font-size: 0.8rem;
        font-weight: 600;
        color: #8b92ab;
        text-transform: uppercase;
        border-bottom: 1px solid #232a45;
        border-left: 1px solid #232a45;
    }
    .grid-header.corner { border-left: none; background: transparent; }
    .grid-header.today-col { color: #a78bfa; }

    .time-label {
        padding: 4px 8px;
        font-size: 0.7rem;
        color: #6b7280;
        text-align: right;
        border-top: 1px solid #1a2038;
        display: flex;
        align-items: flex-start;
        justify-content: flex-end;
        height: 50px;
        box-sizing: border-box;
    }

    .grid-cell {
        border-top: 1px solid #1a2038;
        border-left: 1px solid #1a2038;
        height: 50px;
        position: relative;
        background: #0e1224;
    }
    .grid-cell.today-col { background: rgba(124, 42, 232, 0.05); }

    .class-block {
        position: absolute;
        left: 3px;
        right: 3px;
        background: rgba(124, 42, 232, 0.25);
        border-left: 3px solid #7c2ae8;
        border-radius: 5px;
        padding: 3px 6px;
        font-size: 0.68rem;
        color: #e8eaed;
        overflow: hidden;
        z-index: 2;
    }
    .class-block .section { font-weight: 600; display: block; }
    .class-block .room { color: #c4b5fd; font-size: 0.62rem; }

    .note-block {
        position: absolute;
        left: 3px;
        right: 3px;
        background: rgba(255, 214, 10, 0.15);
        border-left: 3px solid #ffd60a;
        border-radius: 5px;
        padding: 3px 6px;
        font-size: 0.65rem;
        color: #f4e9c1;
        z-index: 2;
    }

    .add-note-cell {
        cursor: pointer;
    }
    .add-note-cell:hover {
        background: rgba(124, 42, 232, 0.1);
    }
    .add-note-cell:hover::after {
        content: "+ note";
        position: absolute;
        top: 4px;
        left: 4px;
        font-size: 0.6rem;
        color: #8b92ab;
    }

    /* Modal dark theme */
    .modal-content {
        background: #131829;
        color: #e8eaed;
        border: 1px solid #232a45;
    }
    .modal-header, .modal-footer { border-color: #232a45; }
    .btn-close { filter: invert(1); }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
    <h4>Faculty Dashboard</h4>
    <div class="topbar-icons">
        <span>🔔</span>
        <span>👤</span>
    </div>
</div>

<div class="layout">

    <!-- Sidebar -->
    <div class="sidebar">
        <a href="#" class="active">Dashboard</a>
        <a href="#">Schedule</a>
        <a href="#">Classes</a>
        <a href="#">Availability</a>
        <a href="#">Notes</a>
        <a href="#">Notifications</a>
        <a href="#">Profile</a>
    </div>

    <!-- Main content -->
    <div class="main">

        <h3 class="greeting">Good morning, Mr. Santos</h3>

        <!-- Status card -->
        <div class="card p-4 mb-4">
            <h6 class="mb-3" style="color:#8b92ab;">STATUS</h6>

            <p class="mb-1"><span class="status-icon-dot"></span>Available</p>
            <p class="mb-3" style="color:#8b92ab;">📍 Room 204</p>

            <hr style="border-color:#232a45;">

            <form method="POST">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label">Change Status</label>
                        <select name="status" class="form-select">
                            <option value="available" selected>Available</option>
                            <option value="in_class">In Class</option>
                            <option value="busy">Busy</option>
                            <option value="in_meeting">In Meeting</option>
                            <option value="consultation_hours">Consultation Hours</option>
                            <option value="out_of_campus">Out of Campus</option>
                        </select>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label">Location</label>
                        <input type="text" name="location" class="form-control" value="Room 204" placeholder="e.g. Room 204">
                    </div>
                    <div class="col-md-3">
                        <button type="submit" name="update_status" value="1" class="btn btn-primary w-100">
                            Update
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Stat cards -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="card p-3 text-center">
                    <div class="stat-number">4</div>
                    <div class="stat-label">Classes</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card p-3 text-center">
                    <div class="stat-number">10:00 AM</div>
                    <div class="stat-label">Next Class</div>
                </div>
            </div>
        </div>

        <!-- Time-grid weekly schedule -->
        <div class="card p-4">
            <h6 class="mb-3">This Week's Schedule</h6>

            <div class="schedule-scroll">
                <div class="time-grid" id="scheduleGrid">
                    <!-- Header row -->
                    <div class="grid-header corner"></div>
                    <div class="grid-header">Mon</div>
                    <div class="grid-header today-col">Tue</div>
                    <div class="grid-header">Wed</div>
                    <div class="grid-header">Thu</div>
                    <div class="grid-header">Fri</div>
                    <div class="grid-header">Sat</div>
                    <div class="grid-header">Sun</div>

                    <!-- Rows generated by JS below (7 AM - 9 PM) -->
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Leave Note Modal -->
<div class="modal fade" id="noteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Leave a Note</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form method="POST">
                <div class="modal-body">
                    <input type="hidden" name="note_day" id="noteDayInput">
                    <input type="hidden" name="note_time" id="noteTimeInput">
                    <label class="form-label">Note for <span id="noteDayText">this day</span> at <span id="noteTimeText">this time</span></label>
                    <textarea name="note_text" class="form-control mt-2" rows="3" placeholder="e.g. Out for a seminar, back by 3pm"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-light btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" name="save_note" value="1" class="btn btn-primary btn-sm">Save Note</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="../assets/bootstrap/js/bootstrap.bundle.min.js"></script>
<script>
    // Sample class data — day index (0=Mon..6=Sun), start hour (24h), duration in hours
    const sampleClasses = [
        { day: 0, hour: 8,  duration: 1.5, section: 'BSIS 2B', room: 'Room 204' },
        { day: 1, hour: 10, duration: 1.5, section: 'BSIS 2A', room: 'Room 305' },
        { day: 2, hour: 8,  duration: 1.5, section: 'BSIS 2B', room: 'Room 204' },
        { day: 3, hour: 13, duration: 2,   section: 'BSIS 3A', room: 'Room 210' },
    ];
    const sampleNotes = [
        { day: 1, hour: 14, text: 'Back by 2pm' }
    ];

    const startHour = 7;   // 7 AM
    const endHour = 21;    // 9 PM
    const grid = document.getElementById('scheduleGrid');

    for (let h = startHour; h < endHour; h++) {
        // Time label column
        const label = document.createElement('div');
        label.className = 'time-label';
        const displayHour = h % 12 === 0 ? 12 : h % 12;
        const ampm = h < 12 ? 'AM' : 'PM';
        label.textContent = `${displayHour}:00 ${ampm}`;
        grid.appendChild(label);

        // 7 day cells for this hour row
        for (let d = 0; d < 7; d++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell add-note-cell' + (d === 1 ? ' today-col' : '');
            cell.dataset.day = d;
            cell.dataset.hour = h;

            const cls = sampleClasses.find(c => c.day === d && c.hour === h);
            if (cls) {
                const block = document.createElement('div');
                block.className = 'class-block';
                block.style.height = (cls.duration * 50 - 4) + 'px';
                block.innerHTML = `<span class="section">${cls.section}</span><span class="room">${cls.room}</span>`;
                cell.appendChild(block);
            }

            const note = sampleNotes.find(n => n.day === d && n.hour === h);
            if (note) {
                const block = document.createElement('div');
                block.className = 'note-block';
                block.textContent = '📝 ' + note.text;
                cell.appendChild(block);
            }

            cell.addEventListener('click', () => {
                const dayNames = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
                const dh = h % 12 === 0 ? 12 : h % 12;
                const ap = h < 12 ? 'AM' : 'PM';
                document.getElementById('noteDayInput').value = dayNames[d];
                document.getElementById('noteTimeInput').value = `${dh}:00 ${ap}`;
                document.getElementById('noteDayText').textContent = dayNames[d];
                document.getElementById('noteTimeText').textContent = `${dh}:00 ${ap}`;
                new bootstrap.Modal(document.getElementById('noteModal')).show();
            });

            grid.appendChild(cell);
        }
    }
</script>

</body>
</html>
